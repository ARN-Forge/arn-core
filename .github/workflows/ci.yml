name: CI

on:
  pull_request:
  push:
    branches: [main]

# Builds and tests only; nothing in this workflow writes to the repository.
permissions:
  contents: read

# A newer push to the same pull request or branch replaces a run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (MSVC)
            os: windows-latest
          - name: Linux x64 (GCC)
            os: ubuntu-24.04
          - name: macOS arm64 (Clang)
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: C:\vcpkg\vcpkg.exe install openssl:x64-windows

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev ninja-build

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install openssl@3 ninja

      # Visual Studio generator, so the MSVC toolchain of the runner image.
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Configure Linux
        if: runner.os == 'Linux'
        env:
          CC: gcc
          CXX: g++
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Configure macOS
        if: runner.os == 'macOS'
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
